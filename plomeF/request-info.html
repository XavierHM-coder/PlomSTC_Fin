<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Request Information | Serna Technical Center</title>
<link href="assets/images/stc-logo-compact.webp" rel="icon" type="image/webp"/>
<link href="css/styles.css" rel="stylesheet"/>
<link href="css/animations.css" rel="stylesheet"/><link href="css/performance.css" rel="stylesheet"/>
</head>
<body>
<div data-site-header=""></div>
<main>
<section class="subhero has-pipe-scene subpage-pipe-section subpage-pipe-right subpage-pipe-lower subpage-pipe-size-medium">
<div class="container subhero-grid">
<div class="reveal"><span class="eyebrow">Take the next step</span>
<h1>Request program information.</h1>
<p class="lead">Share your contact information and the admissions team can help you learn more about
                        the plumbing program.</p>
</div>
<div class="tag-box reveal"><strong>Plumbing Training</strong>
<p>6-month program duration · Up to 13 students per class · In-person, hands-on training in Hillside, Illinois.</p>
</div>
<div class="subhero-pipe-stage" aria-hidden="true">
<div class="mini-pipe-cluster mini-pipe-cluster--hero">
<span class="mini-pipe mini-pipe--vert"></span>
<span class="mini-pipe mini-pipe--horiz"></span>
<span class="mini-pipe-elbow"></span>
<span class="mini-pipe-flange mini-pipe-flange--top"></span>
<span class="mini-pipe-flange mini-pipe-flange--bottom"></span>
<span class="mini-valve-neck"></span>
<span class="mini-valve-wheel"><i></i><i></i><i></i><i></i><b></b></span>
</div>
</div>
</div>
</section>
<section class="section section-cream has-pipe-scene subpage-pipe-section subpage-pipe-left subpage-pipe-upper subpage-pipe-size-large">
<div class="container" style="max-width:880px">
<form class="form-card reveal" data-demo-form="">
<div class="form-grid">
<div class="field"><label for="first">First name</label><input id="first" name="firstName" required=""/></div>
<div class="field"><label for="last">Last name</label><input id="last" name="lastName" required=""/>
</div>
<div class="field"><label for="phone">Phone</label><input id="phone" name="phone" required="" type="tel"/></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" required="" type="email"/></div>
<div class="field full"><label for="program">Program</label><select id="program" name="program">
<option>Plumbing Training Program</option>
</select></div>
<div class="field full"><label for="message">Questions or comments</label><textarea id="message" name="message"></textarea></div>
<div class="field full"><button class="button button-primary" type="submit">Submit
                                Request</button>
<p data-form-note="" style="margin:10px 0 0"></p>
</div>
</div>
</form>
</div>
</section>
</main>
<div data-site-footer=""></div>
<script src="js/layout.js"></script>
<script src="js/animations.js"></script>
<script src="js/app.js"></script>
</body>
</html>
